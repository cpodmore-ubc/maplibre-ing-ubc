<!DOCTYPE html>
<html>

  <head>
    <meta charset="utf-8" />
    <title>MapLibre-ing UBC Submission</title>

    <!-- Load MapLibre's stylesheet (CSS). Its code (JavaScript) is loaded below, in the script. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.css"
    />
  </head>
  
  <body>
    <!-- The web map will go in this div element. -->
    <div id="mapid" style="width: 600px; height: 400px;"></div>

    <script type="module">
      // Load MapLibre's code (JavaScript). Version 6 is loaded as a module, with import.
      import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';

      // Make a map with new maplibregl.Map(), and keep it in the variable map.
      const map = new maplibregl.Map({
        container: 'mapid',                  // the id of the div above
        center: [-123.256113, 49.265637],    // [longitude, latitude]
        zoom: 15,
        style: 'https://tiles.openfreemap.org/styles/positron'   // a ready-made style from OpenFreeMap
      });

      // A module keeps its names to itself. This line lets you type map in the browser's console.
      window.map = map;

      // The raw URL of the UBC Campus Fields file on GitHub.
      const url = 'https://raw.githubusercontent.com/UBCGeodata/ubcv-landscape/refs/heads/master/geojson/ubcv_fields.geojson' 

      // Paint properties set how the layer draws each circle.
      // They are kept in a variable, fieldsPaint, as they will be in next Tuesday's sketches.
      
      const fieldsPaint = {
        // A data-driven expression: the colour depends on each fields SURFACE_TYPE value.
        // 'null' gives grey. 'Ornamental' gives light blue, 'Storm/Ornamental' gives
		// dark blue, 'Storm' gives purple', 'Research' gives green. Any other value, or no value, gives black.
        'fill-color': ['match', ['get', 'SURFACE_TYPE'],
						'null', '#A6A6A6', 
                         'track', '#8F612E',
                         'concrete', '#45413D',
						 'field', '#376E25', 
						 'garden', '#8BE86D', 
                         'astro', '#B1CF2D',
						 '#000000'], 
        'fill-opacity': 0.8
      };

      // When someone clicks a field on the map, MapLibre runs this function.
      // e holds information about the click. e.features[0] is the feature (the fields) that was clicked.
      function fieldsPopup(e) {
        // fields holds that feature's attributes, such as SURFACE_TYPE
        const fields = e.features[0].properties;
        // Does this fields have a SURFACE_TYPE (its use)? If it does not, no popup opens.
        if (fields.SURFACE_TYPE) {
          const popup = new maplibregl.Popup();
          popup.setLngLat(e.lngLat);
          popup.setText(fields.SURFACE_TYPE);
          popup.addTo(map);
        }
      }

      // Add the source and the layer only after the map's style has loaded.
      map.on('load', function () {
        // A source holds the data. data: is the raw URL, so MapLibre fetches the file itself.
        // The fields appear when the whole file has arrived. Meanwhile, the browser goes on to map.addLayer() straight away.
        // attribution is the credit in the map's corner.
        map.addSource('fields', {
          type: 'geojson',
          data: url,
          attribution: 'Fields: UBC Campus Fields, UBCGeodata'
        });

        // A layer says how to draw a source: here, a fill for each field.
        // source: 'fields' is the name that addSource gave the source above.
        map.addLayer({
          id: 'fields-fill',
          type: 'fill',
          source: 'fields',
          paint: fieldsPaint
        });

        map.on('click', 'fields-fill', fieldsPopup);
      });
    </script>
  </body>
</html>
