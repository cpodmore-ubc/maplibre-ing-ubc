<!DOCTYPE html>
<html>

  <head>
    <meta charset="utf-8" />
    <title>MapLibre-ing UBC Submission…</title>

    <!-- Load MapLibre's stylesheet (CSS). Its code (JavaScript) is loaded below, in the script. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.css"
    />
  </head>
  
  <body>
    <!-- The web map will go in this div element. -->
    <div id="mapid" style="width: 600px; height: 400px;"></div>

    <script type="module">
      // Load MapLibre's code (JavaScript). Version 6 is loaded as a module, with import.
      import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';

      // Make a map with new maplibregl.Map(), and keep it in the variable map.
      const map = new maplibregl.Map({
        container: 'mapid',                  // the id of the div above
        center: [-123.256113, 49.265637],    // [longitude, latitude]
        zoom: 15,
        style: 'https://tiles.openfreemap.org/styles/positron'   // a ready-made style from OpenFreeMap
      });

      // A module keeps its names to itself. This line lets you type map in the browser's console.
      window.map = map;

      // The raw URL of the UBC Campus Water Features file on GitHub.
      const url = 'https://raw.githubusercontent.com/UBCGeodata/ubc-geospatial-opendata/refs/heads/master/ubcv/landscape/geojson/ubcv_municipal_waterfeatures.geojson' 

      // Paint properties set how the layer draws each circle.
      // They are kept in a variable, waterFeaturesPaint, as they will be in next Tuesday's sketches.
      
      const waterFeaturesPaint = {
        // A zoom expression: the radius depends on the map's zoom (as in step 8).
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 13, 1, 17, 6],
        // A data-driven expression: the colour depends on each water feature's SUB_TYPE value.
        // 'null' gives grey. 'Ornamental' gives light blue, 'Storm/Ornamental' gives
		// dark blue, 'Storm' gives purple', 'Research' gives green. Any other value, or no value, gives black.
        'circle-color': ['match', ['get', 'SUB_TYPE'],
						'null', '#808080', 
                         'Ornamental', '#8eedee',
                         'Storm/Ornamental', '#297bd5',
						 'Storm', '#c271ee', 
						 'Research', '#53e99d', 
                         '#000000'],
        'circle-opacity': 0.8
      };

      // When someone clicks a water feature on the map, MapLibre runs this function.
      // e holds information about the click. e.features[0] is the feature (the water feature) that was clicked.
      function waterFeaturePopup(e) {
        // water_features holds that feature's attributes, such as SUB_TYPE
        const water_features = e.features[0].properties;
        // Does this water feature have a SUB_TYPE (its use)? If it does not, no popup opens.
        if (water_features.SUB_TYPE) {
          const popup = new maplibregl.Popup();
          popup.setLngLat(e.lngLat);
          popup.setText(water_features.SUB_TYPE);
          popup.addTo(map);
        }
      }

      // Add the source and the layer only after the map's style has loaded.
      map.on('load', function () {
        // A source holds the data. data: is the raw URL, so MapLibre fetches the file itself.
        // The water features appear when the whole file has arrived. Meanwhile, the browser goes on to map.addLayer() straight away.
        // attribution is the credit in the map's corner.
        map.addSource('water_features', {
          type: 'geojson',
          data: url,
          attribution: 'Water Features: UBC Campus Municipal Water Features, UBCGeodata'
        });

        // A layer says how to draw a source: here, a circle for each tree.
        // source: 'trees' is the name that addSource gave the source above.
        map.addLayer({
          id: 'water_features-circles',
          type: 'circle',
          source: 'water_features',
          paint: waterFeaturesPaint
        });

        // When a circle of the layer 'trees-circles' is clicked, MapLibre runs onEachTree.
        // Write onEachTree without (). MapLibre runs it later, once for each click.
        map.on('click', 'water_features-circles', waterFeaturePopup);
      });
    </script>
  </body>
</html>
